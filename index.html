<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio</title>
    <script id="lfh-display-boot-config" type="application/json">__LFH_DISPLAY_BOOT_CONFIG__</script>
    <script>
      (() => {
        try {
          const config = JSON.parse(document.getElementById('lfh-display-boot-config').textContent);
          const storedTheme = localStorage.getItem(config.themeStorageKey);
          const themePreference = config.themePreferences.includes(storedTheme)
            ? storedTheme
            : config.defaultThemePreference;
          const storedFontSize = Number(localStorage.getItem(config.fontSizeStorageKey));
          const fontSize = config.fontSizes.includes(storedFontSize)
            ? storedFontSize
            : config.defaultFontSize;
          const theme = themePreference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : themePreference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = themePreference;
          document.documentElement.dataset.fontSize = String(fontSize);
          document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'system';
          document.documentElement.dataset.fontSize = '16';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
