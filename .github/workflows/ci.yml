name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:version
      - run: npm run typecheck:harness
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:ui
      - run: npm test
